  <!-- Synchronous theme mode initialization to eliminate flash of unstyled theme -->
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('theme-mode');
        var mode = saved === 'light' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-mode', mode);
        var metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) metaTheme.setAttribute('content', mode === 'light' ? '#F3F1EC' : '#0B0B08');
      } catch (e) {}
    })();
  </script>
